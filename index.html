<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width,
                 initial-scale=1,
                 maximum-scale=1,
                 viewport-fit=cover"
    >

    <meta name="theme-color" content="#f2f2f7">

    <title>Focoto</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

    <!-- ================================
         ヘッダー
         ================================ -->

    <header class="header">

        <h1>写真</h1>

    </header>


    <!-- ================================
         写真選択
         ================================ -->

    <section class="select-area">

        <label
            for="photoInput"
            class="photo-button"
        >
            写真を選択
        </label>

        <input
            id="photoInput"
            type="file"
            accept="image/*"
            hidden
        >

    </section>


    <!-- ================================
         写真表示
         ================================ -->

    <main class="photo-area">

        <div
            id="emptyState"
            class="empty-state"
        >

            <div class="empty-icon">
                ＋
            </div>

            <p>
                写真を選択してください
            </p>

        </div>


        <canvas
            id="canvas"
        ></canvas>

    </main>


    <!-- ================================
         編集
         ================================ -->

    <section
        id="controls"
        class="controls"
    >

        <!-- ============================
             モード切り替え
             ============================ -->

        <div class="mode-tabs">

            <button
                id="adjustModeButton"
                class="mode-button active"
                type="button"
            >
                調整
            </button>

            <button
                id="templateModeButton"
                class="mode-button"
                type="button"
            >
                マイテンプレ
            </button>

        </div>


        <!-- ============================
             調整画面
             ============================ -->

        <div
            id="adjustmentPanel"
            class="adjustment-panel"
        >

            <!-- 現在の調整名 -->

            <div class="current-adjustment">

                <div
                    id="adjustmentIcon"
                    class="adjustment-icon"
                >
                    ☀
                </div>

                <div
                    id="adjustmentName"
                    class="adjustment-name"
                >
                    明るさ
                </div>

                <div
                    id="currentValue"
                    class="current-value"
                >
                    0
                </div>

            </div>


            <!-- スライダー -->

            <div
                id="sliderArea"
                class="slider-area"
            >

                <input
                    id="brightness"
                    type="range"
                    min="-100"
                    max="100"
                    step="1"
                    value="0"
                >

                <input
                    id="shadows"
                    type="range"
                    min="-100"
                    max="100"
                    step="1"
                    value="0"
                    hidden
                >

                <input
                    id="contrast"
                    type="range"
                    min="-100"
                    max="100"
                    step="1"
                    value="0"
                    hidden
                >

                <input
                    id="saturation"
                    type="range"
                    min="-100"
                    max="100"
                    step="1"
                    value="0"
                    hidden
                >

                <input
                    id="vignette"
                    type="range"
                    min="-100"
                    max="100"
                    step="1"
                    value="0"
                    hidden
                >

            </div>


            <!-- ========================
                 フォーカス
                 ======================== -->

            <div
                id="focusArea"
                class="focus-area"
                hidden
            >

                <div class="focus-header">

                    <span>
                        フォーカス度
                    </span>

                    <span
                        id="focusValue"
                    >
                        0
                    </span>

                </div>

                <input
                    id="focus"
                    type="range"
                    min="0"
                    max="100"
                    step="1"
                    value="0"
                >

                <p class="focus-help">
                    枠をドラッグ・ピンチ
                </p>

            </div>


            <!-- ========================
                 調整項目
                 ======================== -->

            <div
                class="adjustment-list"
                id="adjustmentList"
            >

                <button
                    class="adjustment-button active"
                    data-adjustment="0"
                    type="button"
                >

                    <span class="adjustment-button-icon">
                        ☀
                    </span>

                    <span>
                        明るさ
                    </span>

                    <span class="selection-dot"></span>

                </button>


                <button
                    class="adjustment-button"
                    data-adjustment="1"
                    type="button"
                >

                    <span class="adjustment-button-icon">
                        ◐
                    </span>

                    <span>
                        シャドウ
                    </span>

                    <span class="selection-dot"></span>

                </button>


                <button
                    class="adjustment-button"
                    data-adjustment="2"
                    type="button"
                >

                    <span class="adjustment-button-icon">
                        ◑
                    </span>

                    <span>
                        コントラスト
                    </span>

                    <span class="selection-dot"></span>

                </button>


                <button
                    class="adjustment-button"
                    data-adjustment="3"
                    type="button"
                >

                    <span class="adjustment-button-icon">
                        ◇
                    </span>

                    <span>
                        彩度
                    </span>

                    <span class="selection-dot"></span>

                </button>


                <button
                    class="adjustment-button"
                    data-adjustment="4"
                    type="button"
                >

                    <span class="adjustment-button-icon">
                        ◌
                    </span>

                    <span>
                        ビネット
                    </span>

                    <span class="selection-dot"></span>

                </button>


                <button
                    class="adjustment-button"
                    data-adjustment="5"
                    type="button"
                >

                    <span class="adjustment-button-icon">
                        ◎
                    </span>

                    <span>
                        フォーカス
                    </span>

                    <span class="selection-dot"></span>

                </button>

            </div>

        </div>


        <!-- ================================
             マイテンプレ
             ================================ -->

        <div
            id="templatePanel"
            class="template-panel"
            hidden
        >

            <button
                id="saveTemplateButton"
                class="template-save-button"
                type="button"
            >
                ＋ 現在の調整をテンプレートとして保存
            </button>


            <div
                id="templateList"
                class="template-list"
            >

                <p
                    id="noTemplates"
                    class="no-templates"
                >
                    保存したテンプレートはありません
                </p>

            </div>

        </div>


        <!-- ================================
             保存・キャンセル
             ================================ -->

        <div class="editor-actions">

            <button
                id="cancelButton"
                type="button"
                class="cancel-button"
            >
                キャンセル
            </button>

            <button
                id="saveButton"
                type="button"
                class="save-button"
            >
                保存
            </button>

        </div>

    </section>

</div>


<script src="app.js"></script>

</body>
</html>
